name: Neuro-X CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check --extend-exclude notebooks"

  notebook-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify notebooks have cleared outputs
        run: |
          python - <<'EOF'
          import json
          import pathlib
          import sys

          dirty = []
          for nb_path in pathlib.Path(".").rglob("*.ipynb"):
              if ".ipynb_checkpoints" in nb_path.parts:
                  continue
              data = json.loads(nb_path.read_text(encoding="utf-8"))
              for idx, cell in enumerate(data.get("cells", [])):
                  if cell.get("cell_type") == "code" and cell.get("outputs"):
                      dirty.append(f"{nb_path} (cell {idx + 1})")
                      break

          if dirty:
              print("Notebooks contain saved outputs. Run 'Edit > Clear all outputs' before committing:")
              for item in dirty:
                  print(f" - {item}")
              sys.exit(1)
          print("All notebooks are clean.")
          EOF
      - name: Block large or restricted data files
        run: |
          python - <<'EOF'
          import pathlib
          import sys

          blocked_exts = {".zip", ".tar", ".nii", ".dcm", ".pt", ".pth", ".onnx", ".ckpt"}
          max_bytes = 10 * 1024 * 1024
          violations = []

          for path in pathlib.Path(".").rglob("*"):
              if ".git" in path.parts or not path.is_file():
                  continue
              name_lower = path.name.lower()
              if path.suffix.lower() in blocked_exts or name_lower.endswith((".nii.gz", ".tar.gz")):
                  violations.append(f"Blocked file type: {path}")
              elif path.stat().st_size > max_bytes:
                  size_mb = path.stat().st_size / (1024 * 1024)
                  violations.append(f"File exceeds 10 MB ({size_mb:.1f} MB): {path}")

          if violations:
              for v in violations:
                  print(v)
              sys.exit(1)
          print("No restricted or oversized files detected.")
          EOF